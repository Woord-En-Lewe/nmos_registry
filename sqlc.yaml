version: "2"
sql:
  - schema: "internal/infrastructure/persistence/sql/schema.sql"
    queries: "internal/infrastructure/persistence/sql/queries.sql"
    engine: "sqlite"
    gen:
      go:
        package: "db"
        out: "internal/infrastructure/persistence/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
        overrides:
          - column: "nodes.tags"
            go_type: "encoding/json.RawMessage"
          - column: "nodes.api"
            go_type: "encoding/json.RawMessage"
          - column: "nodes.caps"
            go_type: "encoding/json.RawMessage"
          - column: "nodes.services"
            go_type: "encoding/json.RawMessage"
          - column: "nodes.clocks"
            go_type: "encoding/json.RawMessage"
          - column: "nodes.interfaces"
            go_type: "encoding/json.RawMessage"
          - column: "devices.tags"
            go_type: "encoding/json.RawMessage"
          - column: "devices.senders"
            go_type: "encoding/json.RawMessage"
          - column: "devices.receivers"
            go_type: "encoding/json.RawMessage"
          - column: "devices.controls"
            go_type: "encoding/json.RawMessage"
          - column: "sources.tags"
            go_type: "encoding/json.RawMessage"
          - column: "sources.grain_rate"
            go_type: "encoding/json.RawMessage"
          - column: "sources.caps"
            go_type: "encoding/json.RawMessage"
          - column: "sources.parents"
            go_type: "encoding/json.RawMessage"
          - column: "flows.tags"
            go_type: "encoding/json.RawMessage"
          - column: "flows.sample_rate"
            go_type: "encoding/json.RawMessage"
          - column: "flows.DID_SDID"
            go_type: "encoding/json.RawMessage"
          - column: "flows.grain_rate"
            go_type: "encoding/json.RawMessage"
          - column: "flows.components"
            go_type: "encoding/json.RawMessage"
          - column: "senders.tags"
            go_type: "encoding/json.RawMessage"
          - column: "senders.interface_bindings"
            go_type: "encoding/json.RawMessage"
          - column: "receivers.tags"
            go_type: "encoding/json.RawMessage"
          - column: "receivers.caps"
            go_type: "encoding/json.RawMessage"
          - column: "receivers.interface_bindings"
            go_type: "encoding/json.RawMessage"
          - column: "subscriptions.params"
            go_type: "encoding/json.RawMessage"
